<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DEPOT — Facility maintenance</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, Inter, sans-serif; background: #EEEDE6; color: #1B222B; }
  button { cursor: pointer; font-family: inherit; }
  input, select, textarea { font-family: inherit; font-size: 13px; border: 1px solid #D8D5C9; border-radius: 3px; padding: 8px 10px; background: #EEEDE6; color: #1B222B; box-sizing: border-box; width: 100%; }
  .btn { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 500; color: #4C6478; background: transparent; border: 1px solid #D8D5C9; border-radius: 3px; padding: 6px 12px; }
  .btn-dark { background: #1B222B; color: #EEEDE6; border-color: #1B222B; }
  .btn-active { background: #1B222B; color: #EEEDE6; border-color: #1B222B; }
  .card { background: #FFFFFF; border: 1px solid #D8D5C9; border-radius: 6px; padding: 16px; }
  .label { font-size: 11px; font-weight: 600; color: #4C6478; text-transform: uppercase; letter-spacing: 0.4px; margin-bottom: 4px; display: block; }
  .tag { display: inline-flex; align-items: center; gap: 6px; font-family: monospace; font-size: 11px; font-weight: 600; text-transform: uppercase; border-radius: 3px; padding: 3px 8px; }
  .row { display: flex; }
  .err { background: #C1443C18; border: 1px solid #C1443C55; color: #7A241F; border-radius: 4px; padding: 8px 12px; font-size: 12px; margin-bottom: 14px; }
  a { color: inherit; }
</style>
</head>
<body>
<div id="app"></div>

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const STATUS = {
  open: { label: "Open", color: "#E3A73B", deep: "#8C5E12" },
  "in-progress": { label: "In progress", color: "#4C6478", deep: "#233542" },
  done: { label: "Done", color: "#3F8354", deep: "#204F30" },
};
const PRIORITY = {
  low: { label: "Low", color: "#8A9AA8" },
  medium: { label: "Medium", color: "#4C6478" },
  high: { label: "High", color: "#E3A73B" },
  critical: { label: "Critical", color: "#C1443C" },
};
const ASSET_STATUS = {
  operational: { label: "Operational", color: "#3F8354", deep: "#204F30" },
  attention: { label: "Needs attention", color: "#E3A73B", deep: "#8C5E12" },
  down: { label: "Down", color: "#C1443C", deep: "#7A241F" },
};

let state = {
  ready: false,
  team: [],
  currentUser: null,
  assets: [],
  orders: [],
  parts: [],
  tab: "dashboard",
  filter: "all",
  query: "",
  showForm: false,
  showAddMember: false,
  showAddPart: false,
  err: "",
};

function uid(prefix) { return `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`; }
function daysUntil(d) { if (!d) return 999; return Math.ceil((new Date(d) - new Date()) / 86400000); }
function esc(s) { return (s || "").toString().replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

async function loadTeam() {
  const { data, error } = await supabase.from("team_members").select("*").order("username");
  if (error) { state.err = error.message; return; }
  state.team = data || [];
}

async function loadData() {
  const [a, o, p] = await Promise.all([
    supabase.from("assets").select("*").order("id"),
    supabase.from("work_orders").select("*").order("created_at", { ascending: false }),
    supabase.from("parts").select("*").order("name"),
  ]);
  if (a.error) state.err = a.error.message;
  if (o.error) state.err = o.error.message;
  if (p.error) state.err = p.error.message;
  state.assets = a.data || [];
  state.orders = o.data || [];
  state.parts = p.data || [];
}

async function init() {
  await loadTeam();
  const savedId = localStorage.getItem("depot-user-id");
  if (savedId) {
    const match = state.team.find(m => m.id === savedId);
    if (match) {
      state.currentUser = match;
      await loadData();
      subscribeRealtime();
    } else {
      localStorage.removeItem("depot-user-id");
    }
  }
  state.ready = true;
  render();
}

function subscribeRealtime() {
  supabase
    .channel("depot-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "assets" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "work_orders" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "parts" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "team_members" }, async () => { await loadTeam(); render(); })
    .subscribe();
}

async function createAdmin(username, pin) {
  state.err = "";
  const member = { id: uid("U"), username, pin, is_admin: true };
  const { error } = await supabase.from("team_members").insert(member);
  if (error) { state.err = error.message; render(); return; }
  await loadTeam();
  state.currentUser = state.team.find(m => m.id === member.id) || member;
  localStorage.setItem("depot-user-id", state.currentUser.id);
  await loadData();
  subscribeRealtime();
  render();
}

function login(username, pin) {
  state.err = "";
  const member = state.team.find(m => m.username === username && m.pin === pin);
  if (!member) { state.err = "That name and PIN don't match."; render(); return; }
  state.currentUser = member;
  localStorage.setItem("depot-user-id", member.id);
  loadData().then(() => { subscribeRealtime(); render(); });
}

function logout() {
  localStorage.removeItem("depot-user-id");
  state.currentUser = null;
  render();
}

async function addMember(username, pin, isAdmin) {
  state.err = "";
  if (state.team.some(m => m.username.toLowerCase() === username.toLowerCase())) {
    state.err = "That name is already on the team."; render(); return;
  }
  const { error } = await supabase.from("team_members").insert({ id: uid("U"), username, pin, is_admin: isAdmin });
  if (error) { state.err = error.message; render(); return; }
  state.showAddMember = false;
  await loadTeam();
  render();
}
async function removeMember(id) {
  if (id === state.currentUser.id) { state.err = "You can't remove your own account while signed in."; render(); return; }
  const { error } = await supabase.from("team_members").delete().eq("id", id);
  if (error) { state.err = error.message; render(); return; }
  await loadTeam();
  render();
}

async function createOrder(wo) {
  const { error } = await supabase.from("work_orders").insert({
    id: wo.id, title: wo.title, asset_id: wo.assetId, priority: wo.priority,
    status: "open", assigned_to: wo.assignedTo, created_by: wo.createdBy,
    due_date: wo.dueDate, notes: wo.notes,
  });
  if (error) { state.err = error.message; render(); } else { state.showForm = false; await loadData(); render(); }
}
async function advanceOrder(id) {
  const cur = state.orders.find(o => o.id === id);
  if (!cur) return;
  const next = cur.status === "open" ? "in-progress" : "done";
  const { error } = await supabase.from("work_orders").update({ status: next }).eq("id", id);
  if (error) { state.err = error.message; render(); } else { await loadData(); render(); }
}
async function deleteOrder(id) {
  const { error } = await supabase.from("work_orders").delete().eq("id", id);
  if (error) { state.err = error.message; render(); } else { await loadData(); render(); }
}

async function addPart(name, category, unit, stock, buffer) {
  state.err = "";
  const { error } = await supabase.from("parts").insert({
    id: uid("PT"), name, category, unit, stock_on_hand: stock, buffer_stock: buffer,
  });
  if (error) { state.err = error.message; render(); return; }
  state.showAddPart = false;
  await loadData();
  render();
}
async function savePart(id, stock, buffer) {
  const { error } = await supabase.from("parts").update({ stock_on_hand: stock, buffer_stock: buffer }).eq("id", id);
  if (error) { state.err = error.message; render(); return; }
  await loadData();
  render();
}
async function deletePart(id) {
  const { error } = await supabase.from("parts").delete().eq("id", id);
  if (error) { state.err = error.message; render(); return; }
  await loadData();
  render();
}

function tagHtml(label, color, deep) {
  return `<span class="tag" style="color:${deep}; background:${color}26; border:1px solid ${color}66;">${esc(label)}</span>`;
}

function ticketHtml(wo, asset) {
  const st = STATUS[wo.status];
  const pr = PRIORITY[wo.priority];
  const overdue = wo.status !== "done" && daysUntil(wo.due_date) < 0;
  return `
  <div class="row" style="background:#fff; border:1px solid #D8D5C9; border-radius:4px; overflow:hidden; margin-bottom:10px;">
    <div style="width:6px; background:${overdue ? "#C1443C" : st.color};"></div>
    <div style="flex:1; padding:14px 16px; min-width:0;">
      <div class="row" style="justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
        <div>
          <div style="font-family:monospace; font-size:11px; color:#8A9AA8; font-weight:600;">${esc(wo.id)}</div>
          <div style="font-weight:600; font-size:16px; margin-top:2px;">${esc(wo.title)}</div>
          <div style="font-size:13px; color:#4C6478; margin-top:4px;">
            ${asset ? esc(asset.name) : "No linked asset"} &middot; assigned to ${esc(wo.assigned_to)} &middot; logged by ${esc(wo.created_by)}
          </div>
        </div>
        <div class="row" style="gap:8px; flex-shrink:0;">
          ${tagHtml(pr.label, pr.color, pr.color)}
          ${tagHtml(st.label, st.color, st.deep)}
        </div>
      </div>
      ${wo.notes ? `<div style="font-size:13px; margin-top:8px; opacity:0.8;">${esc(wo.notes)}</div>` : ""}
      <div class="row" style="justify-content:space-between; align-items:center; margin-top:10px;">
        <div style="font-size:12px; color:${overdue ? "#C1443C" : "#8A9AA8"}; font-weight:${overdue ? 600 : 400};">
          ${wo.status === "done" ? "Closed" : overdue ? "Overdue" : `Due ${esc(wo.due_date || "")}`}
        </div>
        <div class="row" style="gap:6px;">
          ${wo.status !== "done" ? `<button class="btn" onclick="window.__advance('${wo.id}')">${wo.status === "open" ? "Start work" : "Mark done"}</button>` : ""}
          <button class="btn" style="color:#C1443C; border-color:#C1443C55;" onclick="window.__delete('${wo.id}')">Delete</button>
        </div>
      </div>
    </div>
  </div>`;
}

}

      </div>
      <div>

        <input type="number" min="0" id="pt-buffer-${esc(p.id)}" value="${p.buffer_stock}" />

    </div>
    <div style="border-top:1px dashed #D8D5C9; margin-top:12px; padding-top:10px; display:flex; justify-content:space-between; align-items:center;">

      <div class="row" style="gap:6px;">
        <button class="btn" onclick="window.__savePart('${p.id}')">Save</button>

function renderApp() {
  const s = state;
  const openOrders = s.orders.filter(o => o.status !== "done");
  const overdueOrders = openOrders.filter(o => daysUntil(o.due_date) < 0);
  const attentionAssets = s.assets.filter(a => a.status !== "operational");
  const doneOrders = s.orders.filter(o => o.status === "done");
  const reorderParts = s.parts.filter(p => p.stock_on_hand <= p.buffer_stock);

  let filtered = s.orders;
  if (s.filter !== "all") filtered = filtered.filter(o => o.status === s.filter);
  if (s.query.trim()) {
    const q = s.query.toLowerCase();
    filtered = filtered.filter(o => o.title.toLowerCase().includes(q) || o.id.toLowerCase().includes(q));
  }
  filtered = [...filtered].sort((a, b) => (a.status === "done") - (b.status === "done"));

  const nav = (key, label) => `
    <button class="btn ${s.tab === key ? "btn-active" : ""}" style="width:100%; justify-content:flex-start; margin-bottom:4px; padding:10px 14px;" onclick="window.__setTab('${key}')">${label}</button>`;

  let main = "";
  if (s.tab === "dashboard") {
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:18px;">
        <div style="font-weight:700; font-size:22px;">Welcome back, ${esc(s.currentUser.username)}</div>
        <button class="btn btn-dark" onclick="window.__setTab('work-orders'); window.__toggleForm(true)">+ New work order</button>
      </div>
      <div class="row" style="gap:12px; margin-bottom:22px; flex-wrap:wrap;">
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Open work orders</div><div style="font-size:30px; font-weight:700;">${openOrders.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Overdue</div><div style="font-size:30px; font-weight:700; color:${overdueOrders.length ? "#C1443C" : "#1B222B"};">${overdueOrders.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Assets needing attention</div><div style="font-size:30px; font-weight:700; color:${attentionAssets.length ? "#8C5E12" : "#1B222B"};">${attentionAssets.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Completed</div><div style="font-size:30px; font-weight:700; color:#204F30;">${doneOrders.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Parts to reorder</div><div style="font-size:30px; font-weight:700; color:${reorderParts.length ? "#C1443C" : "#1B222B"};">${reorderParts.length}</div></div>
      </div>
      <div style="font-weight:600; font-size:14px; margin-bottom:10px; color:#4C6478; text-transform:uppercase;">Needs attention</div>
      ${[...overdueOrders, ...openOrders.filter(o => !overdueOrders.includes(o))].slice(0, 5).map(wo => ticketHtml(wo, s.assets.find(a => a.id === wo.asset_id))).join("") || `<div style="color:#8A9AA8; font-size:13px; padding:20px 0;">Nothing open. Everything's on track.</div>`}
    `;
  } else if (s.tab === "work-orders") {
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:22px;">Work orders</div>
        <button class="btn btn-dark" onclick="window.__toggleForm(${!s.showForm})">+ New work order</button>
      </div>
      ${s.showForm ? formHtml() : ""}
      <div class="row" style="gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap;">
        ${["all", "open", "in-progress", "done"].map(f => `<button class="btn ${s.filter === f ? "btn-active" : ""}" onclick="window.__setFilter('${f}')">${f === "all" ? "All" : STATUS[f].label}</button>`).join("")}
        <input id="wo-search" placeholder="Search" value="${esc(s.query)}" style="width:140px; margin-left:auto;" oninput="window.__setQuery(this.value)" />
      </div>
      ${filtered.map(wo => ticketHtml(wo, s.assets.find(a => a.id === wo.asset_id))).join("") || `<div style="color:#8A9AA8; font-size:13px; padding:20px 0;">No work orders match.</div>`}
    `;
  } else if (s.tab === "assets") {
    main = `
      <div style="font-weight:700; font-size:22px; margin-bottom:16px;">Assets</div>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px;">
        ${s.assets.map(a => assetHtml(a, s.orders.filter(o => o.asset_id === a.id && o.status !== "done").length)).join("")}
      </div>
    `;
  } else if (s.tab === "parts") {
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div style="font-weight:700; font-size:22px;">Parts</div>
        ${!s.showAddPart ? `<button class="btn btn-dark" onclick="window.__toggleAddPart(true)">+ Add part</button>` : ""}
      </div>
      ${s.showAddPart ? addPartFormHtml() : ""}
      ${reorderParts.length > 0 ? `<div class="err" style="background:#E3A73B18; border-color:#E3A73B55; color:#8C5E12;">${reorderParts.length} part${reorderParts.length > 1 ? "s are" : " is"} at or below buffer stock and may need reordering.</div>` : ""}
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px;">
        ${s.parts.map(partHtml).join("") || `<div style="color:#8A9AA8; font-size:13px;">No parts added yet.</div>`}
      </div>
    `;
  } else if (s.tab === "team") {
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div style="font-weight:700; font-size:22px;">Team</div>
        ${!s.showAddMember ? `<button class="btn btn-dark" onclick="window.__toggleAddMember(true)">+ Add teammate</button>` : ""}
      </div>
      ${s.showAddMember ? addMemberFormHtml() : ""}
      <div class="card">
        ${s.team.map(teamMemberRow).join("")}
      </div>
    `;
  }

  return `
  <div style="max-width:1180px; margin:0 auto; display:flex;">
    <div style="width:210px; padding:24px 14px; flex-shrink:0; border-right:1px solid #D8D5C9; min-height:100vh; display:flex; flex-direction:column;">
      <div style="padding:0 14px 22px;">
        <div style="font-weight:700; font-size:20px;">DEPOT</div>
        <div style="font-size:11px; color:#8A9AA8; margin-top:2px;">Facility maintenance</div>
      </div>
      ${nav("dashboard", "Dashboard")}
      ${nav("work-orders", "Work orders")}
      ${nav("assets", "Assets")}
      ${nav("parts", "Parts")}
      ${s.currentUser.is_admin ? nav("team", "Team") : ""}
      <div style="margin-top:auto; padding-top:16px; border-top:1px solid #D8D5C9;">
        <div style="font-size:13px; font-weight:500;">${esc(s.currentUser.username)} ${s.currentUser.is_admin ? "<span style='color:#8A9AA8; font-size:11px;'>(admin)</span>" : ""}</div>
        <button class="btn" style="margin-top:6px; padding:4px 8px; font-size:11px;" onclick="window.__signOut()">Sign out</button>
      </div>
    </div>
    <div style="flex:1; padding:24px 28px; min-width:0;">
      ${s.err ? `<div class="err">${esc(s.err)}</div>` : ""}
      ${main}
    </div>
  </div>`;
}

function render() {
  const app = document.getElementById("app");
  if (!state.ready) { app.innerHTML = `<div style="padding:40px; text-align:center; color:#4C6478;">Loading depot...</div>`; return; }
  if (!state.currentUser) {
    app.innerHTML = state.team.length === 0 ? renderSetup() : renderLogin();
    return;
  }
  app.innerHTML = renderApp();
}

// ---- global handlers ----
window.__submitSetup = () => {
  const username = document.getElementById("su-username").value.trim();
  const pin = document.getElementById("su-pin").value;
  if (!username) { state.err = "Enter your name."; render(); return; }
  if (!/^\d{4}$/.test(pin)) { state.err = "PIN needs to be 4 digits."; render(); return; }
  createAdmin(username, pin);
};
window.__submitLogin = () => {
  const username = document.getElementById("li-username").value;
  const pin = document.getElementById("li-pin").value;
  login(username, pin);
};
window.__signOut = () => logout();
window.__setTab = (t) => { state.tab = t; render(); };
window.__setFilter = (f) => { state.filter = f; render(); };
window.__setQuery = (q) => { state.query = q; render(); };
window.__toggleForm = (v) => { state.showForm = v; render(); };
window.__toggleAddMember = (v) => { state.showAddMember = v; state.err = ""; render(); };
window.__submitAddMember = () => {
  const username = document.getElementById("am-username").value.trim();
  const pin = document.getElementById("am-pin").value;
  const isAdmin = document.getElementById("am-admin").checked;
  if (!username) { state.err = "Enter a name."; render(); return; }
  if (!/^\d{4}$/.test(pin)) { state.err = "PIN needs to be 4 digits."; render(); return; }
  addMember(username, pin, isAdmin);
};
window.__removeMember = (id) => removeMember(id);
window.__toggleAddPart = (v) => { state.showAddPart = v; state.err = ""; render(); };
window.__submitAddPart = () => {
  const name = document.getElementById("ap-name").value.trim();
  const category = document.getElementById("ap-category").value.trim();
  const unit = document.getElementById("ap-unit").value.trim() || "ea";
  const stock = parseInt(document.getElementById("ap-stock").value, 10) || 0;
  const buffer = parseInt(document.getElementById("ap-buffer").value, 10) || 0;
  if (!name) { state.err = "Enter a part name."; render(); return; }
  addPart(name, category, unit, stock, buffer);
};
window.__savePart = (id) => {
  const stock = parseInt(document.getElementById(`pt-stock-${id}`).value, 10) || 0;
  const buffer = parseInt(document.getElementById(`pt-buffer-${id}`).value, 10) || 0;
  savePart(id, stock, buffer);
};
window.__deletePart = (id) => deletePart(id);
window.__advance = (id) => advanceOrder(id);
window.__delete = (id) => deleteOrder(id);
window.__createOrder = () => {
  const title = document.getElementById("nf-title").value.trim();
  if (!title) return;
  createOrder({
    id: uid("WO"),
    title,
    assetId: document.getElementById("nf-asset").value,
    priority: document.getElementById("nf-priority").value,
    assignedTo: document.getElementById("nf-assigned").value,
    createdBy: state.currentUser.username,
    dueDate: document.getElementById("nf-due").value || new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10),
    notes: document.getElementById("nf-notes").value.trim(),
  });
};

init();
</script>
</body>
</html>
