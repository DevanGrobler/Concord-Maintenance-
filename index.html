function uid(prefix) { return `${prefix}-${Math.floor(1000 + Math.random() * 9000)}`; }
function daysUntil(d) { if (!d) return 999; return Math.ceil((new Date(d) - new Date()) / 86400000); }
function esc(s) { return (s || "").toString().replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function fmt(iso) { if (!iso) return null; return new Date(iso).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }); }
function can(user, perm) { return !!user && (user.is_admin || !!user[perm]); }
function addDays(dateStr, days) { const d = new Date(dateStr); d.setDate(d.getDate() + days); return d.toISOString().slice(0, 10); }
function inspectionStatus(a) {
  if (!a.inspection_interval_days) return { label: "Not scheduled", color: "#8A9AA8", deep: "#4C6478", overdue: false, dueDate: null };
  if (!a.last_inspected) return { label: "Needs first inspection", color: "#C1443C", deep: "#7A241F", overdue: true, dueDate: null };
  const dueDate = addDays(a.last_inspected, a.inspection_interval_days);
  const days = daysUntil(dueDate);
  if (days < 0) return { label: "Overdue", color: "#C1443C", deep: "#7A241F", overdue: true, dueDate };
  if (days <= 7) return { label: "Due soon", color: "#E3A73B", deep: "#8C5E12", overdue: false, dueDate };
  return { label: "On schedule", color: "#3F8354", deep: "#204F30", overdue: false, dueDate };
}
function computeAssetStatus(asset, orders) {
  if (asset.status) return asset.status; // manual override in place
  const open = orders.filter(o => o.asset_id === asset.id && o.status !== "done");
  if (open.some(o => o.priority === "critical")) return "down";
  if (open.length > 0) return "attention";
  return "operational";
}

async function loadTeam() {
  const { data, error } = await supabase.from("team_members").select("*").order("username");
  if (error) { state.err = error.message; return; }
  state.team = data || [];
}

async function loadData() {
  const [a, o, p, ins, cp, cpa] = await Promise.all([
    supabase.from("assets").select("*").order("id"),
    supabase.from("work_orders").select("*").order("created_at", { ascending: false }),
    supabase.from("parts").select("*").order("name"),
    supabase.from("inspections").select("*").order("inspected_at", { ascending: false }),
    supabase.from("inspection_checkpoints").select("*").order("created_at"),
    supabase.from("checkpoint_assets").select("*"),
  ]);
  if (a.error) state.err = a.error.message;
  if (o.error) state.err = o.error.message;
  if (p.error) state.err = p.error.message;
  if (ins.error) state.err = ins.error.message;
  if (cp.error) state.err = cp.error.message;
  if (cpa.error) state.err = cpa.error.message;
  state.assets = a.data || [];
  state.orders = o.data || [];
  state.parts = p.data || [];
  state.inspections = ins.data || [];
  state.checkpoints = cp.data || [];
  const map = {};
  (cpa.data || []).forEach(row => {
    if (!map[row.checkpoint_id]) map[row.checkpoint_id] = [];
    map[row.checkpoint_id].push(row.asset_id);
  });
  state.checkpointAssetMap = map;
}

async function init() {
  // This app doesn't use Supabase Auth (it uses the team_members table instead).
  // If an old session from an earlier version of this app is lingering in local storage,
  // clear it in the background - but never make the app wait on this network call.
  const hasStaleAuthKey = Object.keys(localStorage).some(k => k.startsWith("sb-") && k.includes("auth-token"));
  if (hasStaleAuthKey) {
    supabase.auth.signOut().catch(() => { /* best effort, ignore failures */ });
  }

  await loadTeam();
  const savedId = localStorage.getItem("depot-user-id");
  if (savedId) {
    const match = state.team.find(m => m.id === savedId);
    if (match) {
      state.currentUser = match;
      await loadData();
      subscribeRealtime();
    } else {
      localStorage.removeItem("depot-user-id");
    }
  }
  state.ready = true;
  render();
}

function subscribeRealtime() {
  supabase
    .channel("depot-changes")
    .on("postgres_changes", { event: "*", schema: "public", table: "assets" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "work_orders" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "parts" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "inspections" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "inspection_checkpoints" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "checkpoint_assets" }, async () => { await loadData(); render(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "team_members" }, async () => { await loadTeam(); render(); })
    .subscribe();
}

  localStorage.setItem("depot-user-id", state.currentUser.id);

  subscribeRealtime();
  render();
}

async function advanceOrder(id) {
  const cur = state.orders.find(o => o.id === id);
  if (!cur) return;
  const next = cur.status === "open" ? "in-progress" : "done";
  const patch = { status: next };
  if (next === "in-progress") patch.started_at = new Date().toISOString();
  if (next === "done") { patch.completed_at = new Date().toISOString(); patch.completed_by = state.currentUser.username; }
  const { error } = await supabase.from("work_orders").update(patch).eq("id", id);
  if (error) { state.err = error.message; render(); } else { await loadData(); render(); }
}

async function submitInspection(assetId, result, notes, files, checkpointsChecked) {
  state.err = "";
  const photos = [];
  for (const file of files) {
    const path = `${assetId}/${Date.now()}-${file.name}`;
    const { error: upErr } = await supabase.storage.from("inspection-photos").upload(path, file);
    if (upErr) { state.err = upErr.message; render(); return; }
    const { data: pub } = supabase.storage.from("inspection-photos").getPublicUrl(path);
    photos.push({ url: pub.publicUrl, path });
  }

  let workOrderId = null;
  if (result === "fail") {
    const asset = state.assets.find(a => a.id === assetId);
    workOrderId = uid("WO");
    const { error: woErr } = await supabase.from("work_orders").insert({
      id: workOrderId,
      title: `Failed inspection: ${asset ? asset.name : assetId}`,
      asset_id: assetId,
      priority: "high",
      status: "open",
      assigned_to: state.currentUser.username,
      created_by: state.currentUser.username,
      due_date: new Date(Date.now() + 3 * 86400000).toISOString().slice(0, 10),
      notes: notes || "Auto-created from a failed inspection.",
    });
    if (woErr) { state.err = woErr.message; render(); return; }
  }

  const { error: insErr } = await supabase.from("inspections").insert({
    id: uid("INS"), asset_id: assetId, inspected_by: state.currentUser.username,
    result, notes, photos, work_order_id: workOrderId, checkpoints_checked: checkpointsChecked,
  });
  if (insErr) { state.err = insErr.message; render(); return; }

  const { error: assetErr } = await supabase.from("assets").update({ last_inspected: new Date().toISOString().slice(0, 10) }).eq("id", assetId);
  if (assetErr) { state.err = assetErr.message; render(); return; }

  state.loggingInspectionFor = null;
  await loadData();
  render();
}

async function exportHistoryXlsx() {
  const selectedIds = Object.keys(state.selectedHistory).filter(id => state.selectedHistory[id]);
  const rows = selectedIds.length > 0 ? state.orders.filter(o => selectedIds.includes(o.id)) : state.orders;

  if (!window.ExcelJS) {
    state.err = "The Excel export library didn't load. Check your internet connection, refresh the page, and try again.";
    render();
    return;
  }
  const ExcelJS = window.ExcelJS;

  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet("Work Orders");
  ws.columns = [
    { header: "ID", key: "id", width: 12 },
    { header: "Title", key: "title", width: 30 },
    { header: "Asset", key: "asset", width: 22 },
    { header: "Status", key: "status", width: 14 },
    { header: "Priority", key: "priority", width: 12 },
    { header: "Assigned to", key: "assigned", width: 16 },
    { header: "Logged by", key: "logged", width: 16 },
    { header: "Created", key: "created", width: 20 },
    { header: "Started", key: "started", width: 20 },
    { header: "Completed", key: "completed", width: 20 },
    { header: "Closed by", key: "closedBy", width: 16 },
    { header: "Parts used", key: "parts", width: 30 },
    { header: "Photo", key: "photo", width: 14 },
  ];

  for (const wo of rows) {
    const asset = state.assets.find(a => a.id === wo.asset_id);
    const parts = (wo.parts_used || []).map(pu => `${pu.quantity}x ${pu.part_name}`).join("; ");
    const row = ws.addRow({
      id: wo.id, title: wo.title, asset: asset ? asset.name : "", status: wo.status, priority: wo.priority,
      assigned: wo.assigned_to, logged: wo.created_by, created: wo.created_at || "", started: wo.started_at || "",
      completed: wo.completed_at || "", closedBy: wo.completed_by || "", parts,
    });
    row.height = 56;
    const photos = wo.photos || [];
    if (photos.length > 0) {
      try {
        const resp = await fetch(photos[0].url);
        const buf = await resp.arrayBuffer();
        const ext = (photos[0].url.split(".").pop() || "png").toLowerCase().split("?")[0];
        const safeExt = ["png", "jpg", "jpeg", "gif"].includes(ext) ? (ext === "jpg" ? "jpeg" : ext) : "png";
        const imgId = wb.addImage({ buffer: buf, extension: safeExt });
        ws.addImage(imgId, { tl: { col: 12, row: row.number - 1 }, ext: { width: 70, height: 70 } });
      } catch (e) { /* skip photo if it can't be fetched */ }
    }
  }

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `depot-work-order-history-${new Date().toISOString().slice(0, 10)}.xlsx`;
  a.click();
  URL.revokeObjectURL(url);
}

function workOrdersPerMachineHtml(orders, assets) {
  const counts = {};
  orders.forEach(wo => { if (wo.asset_id) counts[wo.asset_id] = (counts[wo.asset_id] || 0) + 1; });
  const ranked = Object.entries(counts)
    .map(([assetId, count]) => ({
      asset: assets.find(a => a.id === assetId),
      count,
      open: orders.filter(o => o.asset_id === assetId && o.status !== "done").length,
    }))
    .filter(r => r.asset)
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);
  if (ranked.length === 0) return `<div style="font-size:13px; color:#8A9AA8; margin-bottom:16px;">No work orders logged yet.</div>`;
  return `
  <div class="card" style="margin-bottom:16px;">
    <div style="font-weight:600; font-size:14px; margin-bottom:10px; color:#4C6478; text-transform:uppercase;">Work orders per machine</div>

      <div class="row" style="justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid #D8D5C9; cursor:pointer;" onclick="window.__setHistoryAssetFilter('${esc(r.asset.id)}')">

      </div>`).join("")}
  </div>`;
}

function ticketHtml(wo, asset, parts, logPartFor, expandedOrder, canDeleteOrders) {
  const st = STATUS[wo.status];
  const pr = PRIORITY[wo.priority];
  const overdue = wo.status !== "done" && daysUntil(wo.due_date) < 0;
  const partsUsed = wo.parts_used || [];
  const comments = wo.comments || [];
  const isLogging = logPartFor === wo.id;
  const isOpen = expandedOrder === wo.id;

  const detail = !isOpen ? "" : `
    <div style="border-top:1px solid #D8D5C9; margin-top:12px; padding-top:12px;">
      <div class="row" style="gap:18px; flex-wrap:wrap; font-size:12px; color:#4C6478; margin-bottom:12px;">
        <div><span class="label" style="display:inline; margin:0;">Started</span> ${fmt(wo.started_at) ? esc(fmt(wo.started_at)) : "Not started yet"}</div>
        <div><span class="label" style="display:inline; margin:0;">Completed</span> ${fmt(wo.completed_at) ? `${esc(fmt(wo.completed_at))}${wo.completed_by ? ` by ${esc(wo.completed_by)}` : ""}` : "Not completed yet"}</div>
      </div>

      <div class="label">Parts used</div>
      ${partsUsed.length > 0 ? `
      <div style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px;">
        ${partsUsed.map(pu => {
          const usedPart = parts.find(p => p.id === pu.part_id);
          const photo = usedPart && usedPart.photo_url;
          return `<div class="row" style="gap:8px; align-items:center;">
            ${photo ? `<img src="${esc(photo)}" class="part-photo" style="width:28px; height:28px;" />` : `<div style="width:28px; height:28px; border-radius:6px; background:#EEEDE6; border:1px solid #D8D5C9; flex-shrink:0;"></div>`}
            <span style="font-size:13px;">${pu.quantity}× ${esc(pu.part_name)}</span>
          </div>`;
        }).join("")}
      </div>` : `<div style="font-size:12px; color:#8A9AA8; margin-bottom:8px;">None logged yet.</div>`}
      ${isLogging ? `
      <div class="row" style="gap:8px; align-items:flex-end; margin-bottom:12px; padding:10px; background:#EEEDE6; border-radius:4px; flex-wrap:wrap;">
        <div style="flex:1; min-width:140px;">
          <label class="label">Part</label>
          <select id="lp-part-${wo.id}">
            ${(() => {
              const assetParts = parts.filter(p => p.asset_id === wo.asset_id);
              const otherParts = parts.filter(p => p.asset_id !== wo.asset_id);
              const opt = p => `<option value="${esc(p.id)}">${esc(p.name)} (${p.stock_on_hand} on hand)</option>`;
              return `${assetParts.length > 0 ? `<optgroup label="For this asset">${assetParts.map(opt).join("")}</optgroup>` : ""}${otherParts.length > 0 ? `<optgroup label="Other parts">${otherParts.map(opt).join("")}</optgroup>` : ""}`;
            })()}
          </select>
        </div>
        <div style="width:80px;">
          <label class="label">Qty</label>
          <input type="number" min="1" value="1" id="lp-qty-${wo.id}" />
        </div>
        <button class="btn btn-dark" onclick="window.__confirmLogPart('${wo.id}')">Add</button>
        <button class="btn" onclick="window.__toggleLogPart(null)">Cancel</button>
      </div>` : `${parts.length > 0 ? `<button class="btn" style="margin-bottom:12px;" onclick="window.__toggleLogPart('${wo.id}')">+ Log part used</button>` : ""}`}

      <div class="label">Photos</div>
      ${(wo.photos || []).length > 0 ? `
      <div class="row" style="gap:8px; flex-wrap:wrap; margin-bottom:8px;">
        ${(wo.photos || []).map(p => `
        <div style="position:relative;">
          <a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.url)}" style="width:70px; height:70px; object-fit:cover; border-radius:4px; border:1px solid #D8D5C9; display:block;" /></a>
          <button onclick="window.__deletePhoto('${wo.id}','${esc(p.path)}')" style="position:absolute; top:-6px; right:-6px; width:18px; height:18px; border-radius:50%; background:#C1443C; color:#fff; border:none; font-size:11px; line-height:1; cursor:pointer;">×</button>
        </div>`).join("")}
      </div>` : `<div style="font-size:12px; color:#8A9AA8; margin-bottom:8px;">No photos yet.</div>`}
      <input type="file" accept="image/*" id="ph-file-${wo.id}" style="display:none;" onchange="window.__uploadPhoto('${wo.id}')" />
      <button class="btn" style="margin-bottom:12px;" onclick="document.getElementById('ph-file-${wo.id}').click()">+ Add photo</button>

      <div class="label">Comments</div>
      ${comments.length > 0 ? comments.map(c => `
        <div style="margin-bottom:8px;">
          <div style="font-size:12px;"><strong style="font-weight:500;">${esc(c.author)}</strong> <span style="color:#8A9AA8;">${esc(fmt(c.at))}</span></div>
          <div style="font-size:13px;">${esc(c.text)}</div>
        </div>`).join("") : `<div style="font-size:12px; color:#8A9AA8; margin-bottom:8px;">No comments yet.</div>`}

        <input id="cm-text-${wo.id}" placeholder="Add a comment" style="flex:1;" onkeydown="if(event.key==='Enter'){window.__submitComment('${wo.id}')}" />
        <button class="btn" onclick="window.__submitComment('${wo.id}')">Post</button>
      </div>
    </div>`;

  return `
  <div class="row" style="background:#fff; border:1px solid #D8D5C9; border-radius:4px; overflow:hidden; margin-bottom:10px;">
    <div style="width:6px; background:${overdue ? "#C1443C" : st.color};"></div>
    <div style="flex:1; padding:14px 16px; min-width:0;">
      <div class="row" style="justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; cursor:pointer;" onclick="window.__toggleExpand('${wo.id}')">
        <div>
          <div style="font-family:monospace; font-size:11px; color:#8A9AA8; font-weight:600;">${esc(wo.id)}</div>
          <div style="font-weight:600; font-size:16px; margin-top:2px;">${esc(wo.title)}</div>
          <div style="font-size:13px; color:#4C6478; margin-top:4px;">
            ${asset ? esc(asset.name) : "No linked asset"} &middot; assigned to ${esc(wo.assigned_to)} &middot; logged by ${esc(wo.created_by)}
          </div>
        </div>
        <div class="row" style="gap:8px; flex-shrink:0;">
          ${tagHtml(pr.label, pr.color, pr.color)}
          ${tagHtml(st.label, st.color, st.deep)}
        </div>
      </div>
      ${wo.notes ? `<div style="font-size:13px; margin-top:8px; opacity:0.8;">${esc(wo.notes)}</div>` : ""}
      ${detail}
      <div class="row" style="justify-content:space-between; align-items:center; margin-top:10px;">
        <div class="row" style="gap:12px; align-items:center;">
          <button class="btn" style="border:none; padding:0; color:#4C6478;" onclick="window.__toggleExpand('${wo.id}')">${isOpen ? "Close" : "Open"}</button>
          <div style="font-size:12px; color:${overdue ? "#C1443C" : "#8A9AA8"}; font-weight:${overdue ? 600 : 400};">
            ${wo.status === "done" ? "Closed" : overdue ? "Overdue" : `Due ${esc(wo.due_date || "")}`}
          </div>
        </div>
        <div class="row" style="gap:6px;">
          ${wo.status !== "done" ? `<button class="btn" onclick="window.__advance('${wo.id}')">${wo.status === "open" ? "Start work" : "Mark done"}</button>` : ""}
          ${canDeleteOrders ? `<button class="btn" style="color:#C1443C; border-color:#C1443C55;" onclick="window.__delete('${wo.id}')">Delete</button>` : ""}
        </div>
      </div>
    </div>
  </div>`;
}

        <button class="btn" style="color:#C1443C; border-color:#C1443C55;" onclick="window.__deletePart('${p.id}')">Delete</button>

    </div>`;

  return `
  <div class="row" style="background:#fff; border:1px solid #D8D5C9; border-radius:4px; overflow:visible; margin-bottom:8px;">
    <div style="width:6px; background:${needsReorder ? "#C1443C" : "#3F8354"}; flex-shrink:0; border-radius:4px 0 0 4px;"></div>
    <div style="flex:1; padding:10px 14px; min-width:0;">
      <div class="row" style="align-items:center; gap:12px; cursor:pointer;" onclick="window.__toggleExpandPart('${p.id}')">
        <input type="checkbox" style="width:auto; flex-shrink:0;" ${isSelected ? "checked" : ""} onclick="event.stopPropagation();" onchange="window.__togglePartSelect('${p.id}', this.checked)" />
        <input type="file" accept="image/*" id="pp-file-${esc(p.id)}" style="display:none;" onchange="window.__uploadPartPhoto('${esc(p.id)}')" />
        ${p.photo_url
          ? `<img src="${esc(p.photo_url)}" class="part-photo" style="width:36px; height:36px;" title="Click to change photo" onclick="event.stopPropagation(); document.getElementById('pp-file-${esc(p.id)}').click()" />`
          : `<div class="part-photo" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:#EEEDE6; color:#8A9AA8; font-size:8px; text-align:center;" onclick="event.stopPropagation(); document.getElementById('pp-file-${esc(p.id)}').click()">+ Photo</div>`}
        <div style="flex:1; min-width:0;">
          <div class="row" style="gap:8px; align-items:baseline; flex-wrap:wrap;">
            <span style="font-family:monospace; font-size:11px; color:#8A9AA8; font-weight:600;">${p.part_number ? esc(p.part_number) : esc(p.id)}</span>
            <span style="font-weight:600; font-size:14px;">${esc(p.name)}</span>
            ${linkedAsset ? `<span style="font-size:11px; color:#8C5E12;">for ${esc(linkedAsset.name)}</span>` : ""}
          </div>
          <div style="font-size:12px; color:#4C6478;">${esc(p.category || "")} &middot; unit: ${esc(p.unit)}</div>
        </div>
        <div style="text-align:right; flex-shrink:0;">
          <div style="font-size:13px; font-weight:600; color:${needsReorder ? "#C1443C" : "#1B222B"};">${p.stock_on_hand} / ${p.buffer_stock}</div>
          <div style="font-size:10px; color:#8A9AA8;">on hand / buffer</div>
        </div>
        ${needsReorder ? tagHtml("Reorder", "#C1443C", "#7A241F") : tagHtml("OK", "#3F8354", "#204F30")}
      </div>
      ${detail}
    </div>
  </div>`;
}

function reorderNeededRowHtml(part, canManage) {
  const needed = Math.max(part.buffer_stock - part.stock_on_hand, 1);
  return `
  <div class="row" style="background:#fff; border:1px solid #D8D5C9; border-radius:4px; overflow:visible; margin-bottom:8px;">
    <div style="width:6px; background:#C1443C; flex-shrink:0; border-radius:4px 0 0 4px;"></div>
    <div style="flex:1; padding:10px 14px; min-width:0;">
      <div class="row" style="justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap;">
        <div class="row" style="gap:10px; align-items:center;">
          <input type="file" accept="image/*" id="pp-file-${esc(part.id)}" style="display:none;" onchange="window.__uploadPartPhoto('${esc(part.id)}')" />
          ${part.photo_url
            ? `<img src="${esc(part.photo_url)}" class="part-photo" style="width:36px; height:36px;" title="Click to change photo" onclick="document.getElementById('pp-file-${esc(part.id)}').click()" />`
            : `<div class="part-photo" style="width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:#EEEDE6; color:#8A9AA8; font-size:8px; text-align:center;" onclick="document.getElementById('pp-file-${esc(part.id)}').click()">+ Photo</div>`}
          <div>
            <div style="font-weight:600; font-size:14px;">${esc(part.name)}${part.part_number ? ` <span style="font-weight:400; color:#8A9AA8; font-size:12px;">(${esc(part.part_number)})</span>` : ""}</div>
            <div style="font-size:12px; color:#8A9AA8;">${part.stock_on_hand} on hand &middot; buffer ${part.buffer_stock}</div>
          </div>
        </div>
        <div style="font-size:13px; font-weight:600; color:#C1443C;">Order ${needed} ${esc(part.unit)}</div>
      </div>
      ${canManage ? `
      <div class="row" style="gap:8px; align-items:center; margin-top:8px;">
        <label class="label" style="margin:0;">Received</label>
        <input type="number" min="1" id="rc-qty-${esc(part.id)}" value="${needed}" style="width:80px;" />
        <button class="btn btn-dark" onclick="window.__receiveStock('${esc(part.id)}')">Receive</button>
      </div>` : ""}
    </div>
  </div>`;
}

function addPartFormHtml(assets) {

  <div class="card" style="margin-bottom:16px;">
    <div style="font-weight:600; font-size:15px; margin-bottom:14px;">Add part</div>
    <div style="margin-bottom:10px;">
      <label class="label">Part name</label>
      <input id="ap-name" placeholder="e.g. HVAC filter, 20x20" />
    </div>
    <div style="margin-bottom:10px;">
      <label class="label">Part number (optional)</label>
      <input id="ap-partnum" placeholder="Your own catalog / SKU number" />
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px;">
      <div>
        <label class="label">Category</label>
        <input id="ap-category" placeholder="e.g. HVAC" />
      </div>
      <div>
        <label class="label">Unit</label>
        <input id="ap-unit" placeholder="e.g. ea, box, litre" value="ea" />
      </div>
      <div>
        <label class="label">Starting stock on hand</label>
        <input type="number" min="0" id="ap-stock" value="0" />
      </div>
      <div>
        <label class="label">Buffer stock</label>
        <input type="number" min="0" id="ap-buffer" value="0" />
      </div>
    </div>
    <div style="font-size:11px; color:#8A9AA8; margin-bottom:14px;">When stock on hand drops to or below the buffer level, this part is flagged as needing reorder.</div>
    <div style="margin-bottom:14px;">
      <label class="label">Allocated to asset</label>
      <select id="ap-asset">
        <option value="">General stock (not asset-specific)</option>
        ${assets.map(a => `<option value="${esc(a.id)}">${esc(a.name)}</option>`).join("")}
      </select>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;">
      <div>
        <label class="label">Supplier name</label>
        <input id="ap-supname" placeholder="e.g. Acme Parts Co" />
      </div>
      <div>
        <label class="label">Supplier contact</label>
        <input id="ap-supcontact" placeholder="Phone or email" />
      </div>
      <div style="grid-column:1 / -1;">
        <label class="label">Supplier part / SKU number</label>

      <button class="btn" onclick="window.__toggleAddPart(false)">Cancel</button>

  </div>`;
}

function renderApp() {
  const s = state;
  const openOrders = s.orders.filter(o => o.status !== "done");
  const overdueOrders = openOrders.filter(o => daysUntil(o.due_date) < 0);
  const attentionAssets = s.assets.filter(a => computeAssetStatus(a, s.orders) !== "operational");
  const doneOrders = s.orders.filter(o => o.status === "done");
  const reorderParts = s.parts.filter(p => p.stock_on_hand <= p.buffer_stock);
  const overdueInspections = s.assets.filter(a => inspectionStatus(a).overdue);

  let filtered = s.orders;
  if (s.filter !== "all") filtered = filtered.filter(o => o.status === s.filter);
  if (s.query.trim()) {
    const q = s.query.toLowerCase();
    filtered = filtered.filter(o => o.title.toLowerCase().includes(q) || o.id.toLowerCase().includes(q));
  }
  filtered = [...filtered].sort((a, b) => (a.status === "done") - (b.status === "done"));

  const nav = (key, label) => `
    <button class="btn ${s.tab === key ? "btn-active" : ""}" style="width:100%; justify-content:flex-start; margin-bottom:4px; padding:10px 14px;" onclick="window.__setTab('${key}')">${label}</button>`;

  let main = "";
  if (s.tab === "dashboard") {
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:18px;">
        <div style="font-weight:700; font-size:22px;">Welcome back, ${esc(s.currentUser.username)}</div>
        <button class="btn btn-dark" onclick="window.__setTab('work-orders'); window.__toggleForm(true)">+ New work order</button>
      </div>
      ${overdueInspections.length > 0 ? `<div class="err" style="background:#C1443C18; border-color:#C1443C55; color:#7A241F;">${overdueInspections.length} asset${overdueInspections.length > 1 ? "s are" : " is"} overdue for inspection: ${overdueInspections.map(a => esc(a.name)).join(", ")}.</div>` : ""}
      <div class="row" style="gap:12px; margin-bottom:22px; flex-wrap:wrap;">
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Open work orders</div><div style="font-size:30px; font-weight:700;">${openOrders.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Overdue</div><div style="font-size:30px; font-weight:700; color:${overdueOrders.length ? "#C1443C" : "#1B222B"};">${overdueOrders.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Assets needing attention</div><div style="font-size:30px; font-weight:700; color:${attentionAssets.length ? "#8C5E12" : "#1B222B"};">${attentionAssets.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Completed</div><div style="font-size:30px; font-weight:700; color:#204F30;">${doneOrders.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Parts to reorder</div><div style="font-size:30px; font-weight:700; color:${reorderParts.length ? "#C1443C" : "#1B222B"};">${reorderParts.length}</div></div>
        <div class="card" style="flex:1; min-width:130px;"><div style="font-size:12px; color:#4C6478; margin-bottom:6px;">Inspections overdue</div><div style="font-size:30px; font-weight:700; color:${overdueInspections.length ? "#C1443C" : "#1B222B"};">${overdueInspections.length}</div></div>
      </div>
      <div style="font-weight:600; font-size:14px; margin-bottom:10px; color:#4C6478; text-transform:uppercase;">Needs attention</div>
      ${[...overdueOrders, ...openOrders.filter(o => !overdueOrders.includes(o))].slice(0, 5).map(wo => ticketHtml(wo, s.assets.find(a => a.id === wo.asset_id), s.parts, s.logPartFor, s.expandedOrder, can(s.currentUser, "can_delete_work_orders"))).join("") || `<div style="color:#8A9AA8; font-size:13px; padding:20px 0;">Nothing open. Everything's on track.</div>`}
    `;
  } else if (s.tab === "work-orders") {
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:22px;">Work orders</div>
        <button class="btn btn-dark" onclick="window.__toggleForm(${!s.showForm})">+ New work order</button>
      </div>
      ${s.showForm ? formHtml() : ""}
      <div class="row" style="gap:8px; margin-bottom:14px; align-items:center; flex-wrap:wrap;">
        ${["all", "open", "in-progress", "done"].map(f => `<button class="btn ${s.filter === f ? "btn-active" : ""}" onclick="window.__setFilter('${f}')">${f === "all" ? "All" : STATUS[f].label}</button>`).join("")}
        <input id="wo-search" placeholder="Search" value="${esc(s.query)}" style="width:140px; margin-left:auto;" oninput="window.__setQuery(this.value)" />
      </div>
      ${filtered.map(wo => ticketHtml(wo, s.assets.find(a => a.id === wo.asset_id), s.parts, s.logPartFor, s.expandedOrder, can(s.currentUser, "can_delete_work_orders"))).join("") || `<div style="color:#8A9AA8; font-size:13px; padding:20px 0;">No work orders match.</div>`}
    `;
  } else if (s.tab === "assets") {
    const canManageAssets = can(s.currentUser, "can_manage_assets");
    const assetQuery = s.assetsSearch.trim().toLowerCase();
    const filteredAssets = !assetQuery ? s.assets : s.assets.filter(a =>
      a.name.toLowerCase().includes(assetQuery) || a.id.toLowerCase().includes(assetQuery) ||
      (a.category || "").toLowerCase().includes(assetQuery) || (a.location || "").toLowerCase().includes(assetQuery));
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:22px;">Assets</div>
        ${canManageAssets && !s.showAddAsset ? `<button class="btn btn-dark" onclick="window.__toggleAddAsset(true)">+ Add asset</button>` : ""}
      </div>
      ${s.showAddAsset ? addAssetFormHtml() : ""}
      <div style="margin-bottom:14px; max-width:280px;">
        <input placeholder="Search assets..." value="${esc(s.assetsSearch)}" oninput="window.__setAssetsSearch(this.value)" />
      </div>
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px;">
        ${filteredAssets.map(a => assetHtml(a, s.orders.filter(o => o.asset_id === a.id && o.status !== "done").length, canManageAssets, s.orders)).join("") || `<div style="color:#8A9AA8; font-size:13px;">No assets match.</div>`}
      </div>
    `;
  } else if (s.tab === "parts") {

    else if (s.partsAssetFilter !== "all") filteredParts = filteredParts.filter(p => p.asset_id === s.partsAssetFilter);
    const partQuery = s.partsSearch.trim().toLowerCase();
    if (partQuery) filteredParts = filteredParts.filter(p =>
      p.name.toLowerCase().includes(partQuery) || p.id.toLowerCase().includes(partQuery) ||
      (p.part_number || "").toLowerCase().includes(partQuery) ||
      (p.category || "").toLowerCase().includes(partQuery) || (p.supplier_name || "").toLowerCase().includes(partQuery));
    const selectedPartCount = Object.values(s.selectedParts).filter(Boolean).length;

    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:22px;">Parts</div>
        <div class="row" style="gap:8px;">
          <button class="btn btn-dark" onclick="window.__exportParts()">Export for stock take${selectedPartCount > 0 ? ` (${selectedPartCount} selected)` : " (all)"}</button>

        </div>
      </div>
      ${s.showAddPart ? addPartFormHtml(s.assets) : ""}
      ${reorderParts.length > 0 ? `<div class="err" style="background:#E3A73B18; border-color:#E3A73B55; color:#8C5E12;">${reorderParts.length} part${reorderParts.length > 1 ? "s are" : " is"} at or below buffer stock and may need reordering.</div>` : ""}
      <div class="row" style="gap:12px; flex-wrap:wrap; margin-bottom:14px;">
        <div style="max-width:280px; flex:1;">
          <label class="label">Search parts</label>
          <input placeholder="Search by name, ID, category, supplier..." value="${esc(s.partsSearch)}" oninput="window.__setPartsSearch(this.value)" />
        </div>
        <div style="max-width:280px; flex:1;">
          <label class="label">Filter by asset</label>
          <select onchange="window.__setPartsAssetFilter(this.value)">
            <option value="all" ${s.partsAssetFilter === "all" ? "selected" : ""}>All parts</option>
            <option value="general" ${s.partsAssetFilter === "general" ? "selected" : ""}>General stock only</option>
            ${s.assets.map(a => `<option value="${esc(a.id)}" ${s.partsAssetFilter === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}
          </select>
        </div>
      </div>
      <div style="display:flex; flex-direction:column;">
        ${filteredParts.map(p => partHtml(p, s.assets, s.expandedPart === p.id, canManageParts, !!s.selectedParts[p.id])).join("") || `<div style="color:#8A9AA8; font-size:13px;">No parts match.</div>`}
      </div>
    `;
  } else if (s.tab === "reorders") {
    const canManageReorders = can(s.currentUser, "can_manage_parts");
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px; gap:12px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:22px;">Reorders</div>
        ${reorderParts.length > 0 ? `<button class="btn btn-dark" onclick="window.__exportReorders()">Export to Excel</button>` : ""}
      </div>
      <div style="font-size:12px; color:#8A9AA8; margin-bottom:16px;">Live list of parts at or below buffer stock, with the quantity needed to get back to buffer (buffer stock minus what's on hand).</div>
      ${reorderParts.length === 0 ? `<div style="font-size:13px; color:#8A9AA8;">Nothing needs reordering right now.</div>` : reorderParts.map(p => reorderNeededRowHtml(p, canManageReorders)).join("")}
    `;
  } else if (s.tab === "history") {
    const selectedCount = Object.values(s.selectedHistory).filter(Boolean).length;
    main = `
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:22px;">Work order history</div>
        <button class="btn btn-dark" onclick="window.__exportHistory()">Export to Excel${selectedCount > 0 ? ` (${selectedCount} selected)` : " (all)"}</button>
      </div>
      ${workOrdersPerMachineHtml(s.orders, s.assets)}
      <div style="margin-bottom:14px; max-width:280px;">
        <label class="label">Filter by machine</label>
        <select onchange="window.__setHistoryAssetFilter(this.value)">
          <option value="all" ${s.historyAssetFilter === "all" ? "selected" : ""}>All machines</option>
          ${s.assets.map(a => `<option value="${esc(a.id)}" ${s.historyAssetFilter === a.id ? "selected" : ""}>${esc(a.name)}</option>`).join("")}
        </select>
      </div>
      <div class="card" style="overflow-x:auto; padding:0;">
        <table style="width:100%; border-collapse:collapse; font-size:13px;">
          <thead>
            <tr style="border-bottom:1px solid #D8D5C9; text-align:left;">
              <th style="padding:8px 10px;"><input type="checkbox" style="width:auto;" onchange="window.__toggleHistorySelectAll(this.checked)" /></th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">ID</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Title</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Asset</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Status</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Assigned</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Created</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Completed</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Closed by</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;">Photos</th>
              <th style="padding:8px 10px; font-size:11px; color:#4C6478; text-transform:uppercase;"></th>
            </tr>
          </thead>
          <tbody>
            ${[...s.orders].filter(wo => s.historyAssetFilter === "all" || wo.asset_id === s.historyAssetFilter).sort((a, b) => new Date(b.created_at) - new Date(a.created_at)).map(wo => historyRowHtml(wo, s.assets.find(a => a.id === wo.asset_id))).join("") || `<tr><td colspan="11" style="padding:16px; color:#8A9AA8;">No work orders match.</td></tr>`}
          </tbody>
        </table>
      </div>
      ${s.jobCardFor ? jobCardHtml(s.orders.find(o => o.id === s.jobCardFor), s.assets.find(a => a.id === (s.orders.find(o => o.id === s.jobCardFor) || {}).asset_id), s.parts) : ""}
    `;
  } else if (s.tab === "inspections") {
    main = `
      <div style="font-weight:700; font-size:22px; margin-bottom:16px;">Inspections</div>
      ${overdueInspections.length > 0 ? `<div class="err" style="background:#C1443C18; border-color:#C1443C55; color:#7A241F;">${overdueInspections.length} asset${overdueInspections.length > 1 ? "s" : ""} overdue for inspection.</div>` : ""}
      <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:12px;">
        ${s.assets.map(a => inspectionHtml(a, s.inspections.filter(i => i.asset_id === a.id), s.loggingInspectionFor === a.id, s.inspectionHistoryFor === a.id, s.checkpoints, s.checkpointAssetMap)).join("") || `<div style="color:#8A9AA8; font-size:13px;">No assets yet.</div>`}
      </div>
    `;
  } else if (s.tab === "settings") {
    main = `
      <div style="font-weight:700; font-size:22px; margin-bottom:20px;">Settings</div>

      <div style="font-weight:600; font-size:15px; margin-bottom:10px; color:#4C6478; text-transform:uppercase; letter-spacing:0.4px;">Team &amp; permissions</div>
      <div class="row" style="justify-content:flex-end; margin-bottom:12px;">
        ${!s.showAddMember ? `<button class="btn btn-dark" onclick="window.__toggleAddMember(true)">+ Add teammate</button>` : ""}
      </div>
      ${s.showAddMember ? addMemberFormHtml() : ""}
      <div class="card" style="margin-bottom:28px;">
        ${s.team.map(teamMemberRow).join("")}
      </div>

      <div style="font-weight:600; font-size:15px; margin-bottom:10px; color:#4C6478; text-transform:uppercase; letter-spacing:0.4px;">Inspection checklist</div>
      ${manageCheckpointsHtml(s.checkpoints, s.assets, s.checkpointAssetMap)}
    `;
  }

  return `
  <div style="max-width:1180px; margin:0 auto; display:flex;">
    <div style="width:210px; padding:24px 14px; flex-shrink:0; border-right:1px solid #D8D5C9; min-height:100vh; display:flex; flex-direction:column;">
      <div style="padding:0 14px 22px;">
        <div style="font-weight:700; font-size:20px;">FleX</div>
        <div style="font-size:11px; color:#8A9AA8; margin-top:2px;">Facility Management</div>
      </div>
      ${nav("dashboard", "Dashboard")}
      ${nav("work-orders", "Work orders")}
      ${nav("assets", "Assets")}
      ${nav("parts", "Parts")}
      ${nav("reorders", "Reorders")}
      ${nav("inspections", "Inspections")}
      ${nav("history", "History")}
      ${s.currentUser.is_admin ? nav("settings", "Settings") : ""}
      <div style="margin-top:auto; padding-top:16px; border-top:1px solid #D8D5C9;">
        <div style="font-size:13px; font-weight:500;">${esc(s.currentUser.username)} ${s.currentUser.is_admin ? "<span style='color:#8A9AA8; font-size:11px;'>(admin)</span>" : ""}</div>
        <div class="row" style="gap:10px; margin-top:6px;">
          <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="window.__toggleChangePin(true)">Change PIN</button>
          <button class="btn" style="padding:4px 8px; font-size:11px;" onclick="window.__signOut()">Sign out</button>
        </div>
      </div>
    </div>
    <div style="flex:1; padding:24px 28px; min-width:0;">
      ${s.err ? `<div class="err">${esc(s.err)}</div>` : ""}
      ${main}
    </div>
  </div>
  ${(() => {
    const undismissed = reorderParts.filter(p => !s.reorderPopupDismissedIds.includes(p.id));
    return undismissed.length > 0 ? reorderPopupHtml(undismissed) : "";
  })()}
  ${s.showChangePin ? changePinPopupHtml(s.err) : ""}`;
}

function render() {
  const app = document.getElementById("app");
  if (!state.ready) { app.innerHTML = `<div style="padding:40px; text-align:center; color:#4C6478;">Loading depot...</div>`; return; }
  if (!state.currentUser) {
    app.innerHTML = state.team.length === 0 ? renderSetup() : renderLogin();
    return;
  }
  app.innerHTML = renderApp();
}

// ---- global handlers ----
window.__submitSetup = () => {
  const username = document.getElementById("su-username").value.trim();
  const pin = document.getElementById("su-pin").value;
  if (!username) { state.err = "Enter your name."; render(); return; }
  if (!/^\d{4}$/.test(pin)) { state.err = "PIN needs to be 4 digits."; render(); return; }
  createAdmin(username, pin);
};
window.__submitLogin = () => {
  const username = document.getElementById("li-username").value;
  const pin = document.getElementById("li-pin").value;
  login(username, pin);
};
window.__signOut = () => logout();
window.__setTab = (t) => { state.tab = t; render(); };
window.__setFilter = (f) => { state.filter = f; render(); };
window.__setQuery = (q) => { state.query = q; render(); };
window.__toggleForm = (v) => { state.showForm = v; render(); };
window.__toggleAddMember = (v) => { state.showAddMember = v; state.err = ""; render(); };
window.__submitAddMember = () => {
  const username = document.getElementById("am-username").value.trim();
  const pin = document.getElementById("am-pin").value;
  const isAdmin = document.getElementById("am-admin").checked;
  const perms = {
    assets: document.getElementById("am-perm-assets").checked,
    parts: document.getElementById("am-perm-parts").checked,
    deleteOrders: document.getElementById("am-perm-delwo").checked,
  };
  if (!username) { state.err = "Enter a name."; render(); return; }
  if (!/^\d{4}$/.test(pin)) { state.err = "PIN needs to be 4 digits."; render(); return; }
  addMember(username, pin, isAdmin, perms);
};
window.__removeMember = (id) => removeMember(id);
window.__savePermissions = (id) => {
  const isAdmin = document.getElementById(`perm-admin-${id}`).checked;
  const perms = {
    assets: document.getElementById(`perm-assets-${id}`).checked,
    parts: document.getElementById(`perm-parts-${id}`).checked,
    deleteOrders: document.getElementById(`perm-delwo-${id}`).checked,
  };
  savePermissions(id, isAdmin, perms);
};
window.__toggleChangePin = (v) => { state.showChangePin = v; state.err = ""; render(); };
window.__submitChangePin = () => {
  const current = document.getElementById("cp-current").value;
  const next = document.getElementById("cp-new").value;
  const confirm = document.getElementById("cp-confirm").value;
  if (current !== state.currentUser.pin) { state.err = "Current PIN is incorrect."; render(); return; }
  if (!/^\d{4}$/.test(next)) { state.err = "New PIN needs to be 4 digits."; render(); return; }
  if (next !== confirm) { state.err = "New PIN and confirmation don't match."; render(); return; }
  changePin(next);
};
window.__toggleAddPart = (v) => { state.showAddPart = v; state.err = ""; render(); };
window.__toggleAddAsset = (v) => { state.showAddAsset = v; state.err = ""; render(); };
window.__submitAddAsset = () => {
  const name = document.getElementById("aa-name").value.trim();
  const category = document.getElementById("aa-category").value.trim();
  const location = document.getElementById("aa-location").value.trim();
  if (!name) { state.err = "Enter an asset name."; render(); return; }
  addAsset(name, category, location);
};
window.__deleteAsset = (id) => deleteAsset(id);
window.__setStatusOverride = (id, value) => setAssetStatusOverride(id, value);
window.__setHistoryAssetFilter = (val) => { state.historyAssetFilter = val; render(); };
window.__submitAddPart = () => {
  const name = document.getElementById("ap-name").value.trim();
  const partNumber = document.getElementById("ap-partnum").value.trim();
  const category = document.getElementById("ap-category").value.trim();
  const unit = document.getElementById("ap-unit").value.trim() || "ea";
  const stock = parseInt(document.getElementById("ap-stock").value, 10) || 0;
  const buffer = parseInt(document.getElementById("ap-buffer").value, 10) || 0;
  const assetId = document.getElementById("ap-asset").value;
  const supName = document.getElementById("ap-supname").value.trim();
  const supContact = document.getElementById("ap-supcontact").value.trim();
  const supSku = document.getElementById("ap-supsku").value.trim();
  if (!name) { state.err = "Enter a part name."; render(); return; }
  addPart(name, category, unit, stock, buffer, supName, supContact, supSku, assetId, partNumber);
};
window.__savePart = (id) => {
  const stock = parseInt(document.getElementById(`pt-stock-${id}`).value, 10) || 0;
  const buffer = parseInt(document.getElementById(`pt-buffer-${id}`).value, 10) || 0;
  const assetId = document.getElementById(`pt-asset-${id}`).value;
  const partNumber = document.getElementById(`pt-partnum-${id}`).value.trim();
  const supName = document.getElementById(`pt-supname-${id}`).value.trim();
  const supContact = document.getElementById(`pt-supcontact-${id}`).value.trim();
  const supSku = document.getElementById(`pt-supsku-${id}`).value.trim();
  savePart(id, stock, buffer, supName, supContact, supSku, assetId, partNumber);
};
window.__uploadPartPhoto = (partId) => {
  const input = document.getElementById(`pp-file-${partId}`);
  const file = input.files[0];
  if (!file) return;
  uploadPartPhoto(partId, file);
  input.value = "";
};
window.__deletePart = (id) => deletePart(id);
window.__toggleExpandPart = (id) => { state.expandedPart = state.expandedPart === id ? null : id; render(); };
window.__setPartsAssetFilter = (val) => { state.partsAssetFilter = val; render(); };
window.__setPartsSearch = (val) => { state.partsSearch = val; render(); };
window.__setAssetsSearch = (val) => { state.assetsSearch = val; render(); };
window.__togglePartSelect = (id, checked) => { state.selectedParts[id] = checked; render(); };
window.__exportParts = () => exportPartsXlsx();
window.__exportReorders = () => exportReordersXlsx();
window.__receiveStock = (partId) => {
  const quantity = parseInt(document.getElementById(`rc-qty-${partId}`).value, 10);
  receiveStock(partId, quantity);
};
window.__toggleLogPart = (orderId) => { state.logPartFor = orderId; render(); };
window.__confirmLogPart = (orderId) => {
  const partId = document.getElementById(`lp-part-${orderId}`).value;
  const qty = parseInt(document.getElementById(`lp-qty-${orderId}`).value, 10) || 0;
  if (qty <= 0) return;
  logPartUsage(orderId, partId, qty);
};
window.__toggleExpand = (orderId) => { state.expandedOrder = state.expandedOrder === orderId ? null : orderId; state.logPartFor = null; render(); };
window.__submitComment = (orderId) => {
  const input = document.getElementById(`cm-text-${orderId}`);
  const text = input.value;
  if (!text.trim()) return;
  addComment(orderId, text);
};
window.__saveInterval = (assetId) => {
  const val = parseInt(document.getElementById(`ins-interval-${assetId}`).value, 10);
  if (!val || val <= 0) { state.err = "Enter a positive number of days."; render(); return; }
  saveInspectionInterval(assetId, val);
};
window.__uploadAssetPhoto = (assetId) => {
  const input = document.getElementById(`as-file-${assetId}`);
  const file = input.files[0];
  if (!file) return;
  uploadAssetPhoto(assetId, file);
  input.value = "";
};
window.__toggleLogInspection = (assetId) => { state.loggingInspectionFor = assetId; render(); };
window.__toggleInspectionHistory = (assetId) => { state.inspectionHistoryFor = state.inspectionHistoryFor === assetId ? null : assetId; render(); };
window.__submitInspection = (assetId) => {
  const result = document.getElementById(`ins-result-${assetId}`).value;
  const notes = document.getElementById(`ins-notes-${assetId}`).value.trim();
  const fileInput = document.getElementById(`ins-photos-${assetId}`);
  const files = fileInput.files ? Array.from(fileInput.files) : [];
  const relevant = state.checkpoints.filter(cp => {
    const covered = state.checkpointAssetMap[cp.id] || [];
    return covered.length === 0 || covered.includes(assetId);
  });
  const checkpointsChecked = relevant.map(cp => {
    const box = document.getElementById(`ckpt-${assetId}-${cp.id}`);
    return { id: cp.id, label: cp.label, checked: box ? box.checked : false };
  });
  submitInspection(assetId, result, notes, files, checkpointsChecked);
};
window.__submitCheckpoint = () => {
  const input = document.getElementById("ckp-new-label");
  const checked = Array.from(document.querySelectorAll(".ckp-new-machine:checked")).map(el => el.value);
  addCheckpoint(input.value, checked);
};
window.__deleteCheckpoint = (id) => deleteCheckpoint(id);
window.__exportHistory = () => exportHistoryXlsx();
window.__toggleHistorySelect = (id, checked) => { state.selectedHistory[id] = checked; render(); };
window.__toggleHistorySelectAll = (checked) => {
  state.orders.forEach(o => { state.selectedHistory[o.id] = checked; });
  render();
};
window.__openJobCard = (id) => { state.jobCardFor = id; render(); };
window.__closeJobCard = () => { state.jobCardFor = null; render(); };
window.__dismissReorderPopup = () => {
  state.reorderPopupDismissedIds = state.parts.filter(p => p.stock_on_hand <= p.buffer_stock).map(p => p.id);
  render();
};
window.__goToPartsFromPopup = () => {
  state.reorderPopupDismissedIds = state.parts.filter(p => p.stock_on_hand <= p.buffer_stock).map(p => p.id);
  state.tab = "parts";
  render();
};
window.__uploadPhoto = (orderId) => {
  const input = document.getElementById(`ph-file-${orderId}`);
  const file = input.files[0];
  if (!file) return;
  uploadPhoto(orderId, file);
  input.value = "";
};
window.__deletePhoto = (orderId, path) => deletePhoto(orderId, path);
window.__advance = (id) => advanceOrder(id);
window.__delete = (id) => deleteOrder(id);
window.__createOrder = () => {
  const title = document.getElementById("nf-title").value.trim();
  if (!title) return;
  createOrder({
    id: uid("WO"),
    title,
    assetId: document.getElementById("nf-asset").value,
    priority: document.getElementById("nf-priority").value,
    assignedTo: document.getElementById("nf-assigned").value,
    createdBy: state.currentUser.username,
    dueDate: document.getElementById("nf-due").value || new Date(Date.now() + 7 * 86400000).toISOString().slice(0, 10),
    notes: document.getElementById("nf-notes").value.trim(),
  });
};

init();
</script>
</body>
</html>
